<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HyperNym Onboarding</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes white. Dark is the default,
    // as in IoTility. Keep in step with src/app/core/theme/theme.ts.
    (function () {
      var dark = true;
      try {
        var pref = localStorage.getItem('hn-theme') || 'dark';
        dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {}
      var root = document.documentElement;
      root.classList.toggle('dark', dark);
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The HyperNym H mark in its brand colours (purple and cyan), readable on light and dark tabs. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /*
     * Boot screen, IoTility's pattern (projects/iotility/src/index.html): a black base with soft brand glows, the
     * logo, a slim indeterminate bar and one status line. It paints before any stylesheet loads, so the colours
     * carry fallbacks for the brand tokens. main.ts fades it out once the first page has rendered.
     */
    .bootstrap-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 0 1.5rem;
      box-sizing: border-box;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(18rem 13rem at 50% 44%, color-mix(in srgb, var(--color-brand-500, #a855f7) 22%, transparent), transparent 100%),
        radial-gradient(60vmax 44vmax at 50% 44%, color-mix(in srgb, var(--color-brand-600, #9333ea) 14%, transparent), transparent 100%),
        radial-gradient(130vw 34vh at 50% 108%, color-mix(in srgb, var(--color-brand-700, #7e22ce) 26%, transparent), transparent 100%),
        #000;
      -webkit-font-smoothing: antialiased;
      transition:
        opacity 320ms cubic-bezier(0.23, 1, 0.32, 1),
        transform 320ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .bootstrap-loading.is-leaving {
      opacity: 0;
      transform: scale(1.015);
      pointer-events: none;
    }
    .bootstrap-loading__content {
      display: flex;
      max-width: 26rem;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .bootstrap-loading__logo {
      display: block;
      width: auto;
      max-width: 18rem;
      height: 3.25rem;
      animation: bootstrap-loading-logo-in 560ms cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    .bootstrap-loading__track {
      position: relative;
      width: 9rem;
      height: 2px;
      margin-top: 1.75rem;
      overflow: hidden;
      border-radius: 9999px;
      background: rgb(255 255 255 / 8%);
      animation: bootstrap-loading-fade 480ms ease-out 120ms both;
    }
    .bootstrap-loading__bar {
      width: 45%;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, var(--color-brand-400, #c084fc) 55%, var(--color-brand-200, #e9d5ff));
      box-shadow: 0 0 8px color-mix(in srgb, var(--color-brand-500, #a855f7) 80%, transparent);
      animation: bootstrap-loading-bar 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .bootstrap-loading__status {
      margin: 1.25rem 0 0;
      color: rgb(255 255 255 / 88%);
      font-size: 0.875rem;
      font-weight: 550;
      line-height: 1.25rem;
      animation: bootstrap-loading-fade 480ms ease-out 160ms both;
    }
    .bootstrap-loading__message {
      margin: 0.375rem 0 0;
      color: rgb(255 255 255 / 55%);
      font-size: 0.75rem;
      line-height: 1.125rem;
      animation: bootstrap-loading-fade 480ms ease-out 200ms both;
    }
    @keyframes bootstrap-loading-logo-in {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.97);
      }
    }
    @keyframes bootstrap-loading-fade {
      from {
        opacity: 0;
      }
    }
    @keyframes bootstrap-loading-bar {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(225%);
      }
    }
    @media (max-width: 480px) {
      .bootstrap-loading__logo {
        height: 2.5rem;
        max-width: 13rem;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .bootstrap-loading__logo,
      .bootstrap-loading__track,
      .bootstrap-loading__status,
      .bootstrap-loading__message {
        animation: none;
      }
      .bootstrap-loading__bar {
        animation-duration: 2.4s;
        animation-timing-function: linear;
      }
      .bootstrap-loading {
        transition: opacity 200ms linear;
      }
      .bootstrap-loading.is-leaving {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main id="bootstrap-loading" class="bootstrap-loading">
    <section class="bootstrap-loading__content" role="status" aria-live="polite" aria-busy="true">
      <img src="assets/hypernym-loader-full.svg" alt="" class="bootstrap-loading__logo" aria-hidden="true">
      <div class="bootstrap-loading__track" aria-hidden="true"><div class="bootstrap-loading__bar"></div></div>
      <p class="bootstrap-loading__status">Starting HyperNym Onboarding</p>
      <p class="bootstrap-loading__message">Preparing customers, devices and orders&hellip;</p>
    </section>
  </main>
  <app-root></app-root>
</body>
</html>
